<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipwright review</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="bar">
  <strong>Clipwright</strong>
  <nav aria-label="Sections">
    <a href="/sources"{% if request.url.path.startswith('/sources') %} aria-current="page"{% endif %}>Sources</a>
    <a href="/clips"{% if request.url.path.startswith('/clips') %} aria-current="page"{% endif %}>Clips</a>
  </nav>
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
